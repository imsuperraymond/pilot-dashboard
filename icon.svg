<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A5CF0"/>
      <stop offset="50%" stop-color="#1E7BF5"/>
      <stop offset="100%" stop-color="#3D9AFF"/>
    </linearGradient>
    <linearGradient id="compass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E8F0FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Outer ring -->
    <circle r="185" fill="none" stroke="white" stroke-width="4" opacity="0.2"/>
    <circle r="170" fill="#0A3DAA" opacity="0.3"/>
    <circle r="165" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
    <!-- Cardinal ticks -->
    <g stroke="white" stroke-width="6" opacity="0.4" stroke-linecap="round">
      <line x1="0" y1="-185" x2="0" y2="-165"/>
      <line x1="0" y1="185" x2="0" y2="165"/>
      <line x1="-185" y1="0" x2="-165" y2="0"/>
      <line x1="185" y1="0" x2="165" y2="0"/>
    </g>
    <!-- Intercardinal ticks -->
    <g stroke="white" stroke-width="3" opacity="0.25" stroke-linecap="round">
      <line x1="-131" y1="-131" x2="-117" y2="-117"/>
      <line x1="131" y1="-131" x2="117" y2="-117"/>
      <line x1="-131" y1="131" x2="-117" y2="117"/>
      <line x1="131" y1="131" x2="117" y2="117"/>
    </g>
    <!-- Compass rose -->
    <polygon points="0,-130 -48,-48 -130,0 -48,48 0,130 48,48 130,0 48,-48" fill="url(#compass)" opacity="0.95"/>
    <!-- N indicator -->
    <polygon points="0,-130 -16,-48 16,-48" fill="#0A5CF0" opacity="0.9"/>
    <!-- S indicator -->
    <polygon points="-16,48 16,48 0,130" fill="#3D9AFF" opacity="0.6"/>
    <!-- E indicator -->
    <polygon points="48,-16 48,16 130,0" fill="#3D9AFF" opacity="0.7"/>
    <!-- W indicator -->
    <polygon points="-130,0 -48,-16 -48,16" fill="#3D9AFF" opacity="0.5"/>
    <!-- Center dot -->
    <circle r="28" fill="white"/>
    <circle r="18" fill="#0A5CF0"/>
    <circle r="8" fill="white"/>
  </g>
</svg>
