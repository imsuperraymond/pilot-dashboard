<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raymond工作台">
<meta name="theme-color" content="#1E3A2F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Raymond · 全球物流工作台</title>
<style>
:root{
  --bg:#F5F2EC; --bg-card:#FFFCF8; --bg-soft:#EDE9E2; --bg-subtle:#F8F5F0;
  --text:#1A1918; --text-2:#6B6862; --text-3:#9C9790;
  --border:#E3DDD4; --border-light:#F0EBE3;
  --pri:#1E3A2F; --pri-light:#2D5A47; --pri-bg:#E8F0EC;
  --acc:#A87552; --acc-bg:#FDF5EF;
  --hi:#C14035; --hi-bg:#FEF0EE;
  --mid:#C6893A; --mid-bg:#FFF6EC;
  --lo:#4A7C59; --lo-bg:#EDF4EF;
  --info:#3B7EA5; --info-bg:#EEF5FA;
  --r:10px; --r-sm:7px; --r-xs:5px;
  --sh:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);
  --serif:Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-size:16px;background:var(--bg-card);color:var(--text);outline:none;transition:border .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
::placeholder{color:var(--text-3)}

#app{display:flex;min-height:100dvh}
.sidebar{width:200px;min-width:200px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;padding:20px 12px}
.sidebar-brand{display:flex;align-items:center;gap:8px;margin-bottom:24px;padding:0 8px}
.sidebar-brand svg{flex-shrink:0}
.sidebar-brand .title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);line-height:1.3}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:3px}
.sidebar-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;color:var(--text-2);transition:all .15s;text-align:left;width:100%}
.sidebar-nav button:hover{background:var(--bg-soft);color:var(--text)}
.sidebar-nav button.active{background:var(--pri-bg);color:var(--pri);font-weight:600}
.sidebar-footer{padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sidebar-footer .count{font-size:11px;color:var(--text-3);padding:2px 8px}
.sidebar-footer button{padding:7px 10px;border-radius:var(--r-xs);font-size:12px;color:var(--text-2);text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.sidebar-footer button:hover{background:var(--bg-soft);color:var(--text)}

.topbar{display:none;position:fixed;top:0;left:0;right:0;height:50px;background:var(--bg-card);border-bottom:1px solid var(--border);z-index:100;align-items:center;justify-content:space-between;padding:0 14px}
.topbar .title{font-family:var(--serif);font-size:16px;font-weight:700}
.topbar .actions{display:flex;gap:6px}

.main{margin-left:200px;flex:1;min-width:0;padding:24px 28px 110px;max-width:1060px}
@media(max-width:767px){
  .sidebar{display:none}.topbar{display:flex}.main{margin-left:0;padding:58px 12px 100px}
}

.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:100;padding:5px 6px calc(5px+env(safe-area-inset-bottom))}
.bottom-nav-inner{display:flex;justify-content:space-around}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;min-width:52px;min-height:48px;border-radius:var(--r-sm);color:var(--text-3);font-size:10px;transition:all .15s}
.bottom-nav button.active{color:var(--pri)}
.bottom-nav button svg{width:21px;height:21px}
@media(max-width:767px){.bottom-nav{display:block}}

h2{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px;color:var(--text)}
h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text)}
h4{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:6px}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card-sm{padding:12px 16px;margin-bottom:10px}

.btn{padding:7px 16px;border-radius:var(--r-xs);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-height:36px}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-light)}
.btn-out{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn-out:hover{background:var(--pri-bg)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:var(--bg-soft)}
.btn-sm{padding:4px 10px;font-size:12px;min-height:30px}
.btn-xs{padding:2px 8px;font-size:11px;min-height:26px;border-radius:var(--r-xs)}

.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.fg-row{display:flex;gap:8px;flex-wrap:wrap}
.fg-row>*{flex:1;min-width:90px}

.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge-hi{background:var(--hi-bg);color:var(--hi)}
.badge-mid{background:var(--mid-bg);color:var(--mid)}
.badge-lo{background:var(--lo-bg);color:var(--lo)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-pri{background:var(--pri-bg);color:var(--pri)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-light);line-height:1.5}
.tbl tbody tr:hover td{background:var(--bg-subtle)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-wrap .tbl{min-width:600px}

.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s;margin:0 3px 3px 0}
.tag:hover,.tag.active{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}

.progress-bar{height:5px;background:var(--bg-soft);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease}
.progress-fill.green{background:var(--lo)}
.progress-fill.amber{background:var(--mid)}
.progress-fill.red{background:var(--hi)}
.progress-fill.pri{background:var(--pri)}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat-val{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--text);line-height:1.2}
.stat-label{font-size:12px;color:var(--text-3);margin-top:3px}
.stat-sub{font-size:11px;color:var(--text-2);margin-top:2px}
.stat-sub.up{color:var(--lo)}
.stat-sub.down{color:var(--hi)}

.alert-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.alert-row:last-child{border-bottom:none}
.alert-row .alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.alert-row .alert-dot.hi{background:var(--hi)}
.alert-row .alert-dot.mid{background:var(--mid)}
.alert-row .alert-dot.lo{background:var(--lo)}
.alert-row .alert-body{flex:1;min-width:0}
.alert-row .alert-title{font-size:13px;font-weight:600;line-height:1.5}
.alert-row .alert-desc{font-size:12px;color:var(--text-2);line-height:1.6;margin-top:2px;word-break:break-word}
.alert-row .alert-meta{font-size:11px;color:var(--text-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.alert-row .alert-alt{font-size:11px;color:var(--text-2);background:var(--bg-soft);border-radius:var(--r-sm);padding:4px 8px;margin-top:4px;line-height:1.5;word-break:break-word}

.news-item{padding:10px 0;border-bottom:1px solid var(--border-light)}
.news-item:last-child{border-bottom:none}
.news-item .news-head{font-size:11px;color:var(--text-3);margin-bottom:3px}
.news-item .news-title{font-weight:600;font-size:14px;line-height:1.5}
.news-item .news-desc{font-size:13px;color:var(--text-2);line-height:1.6;margin-top:3px}

.insight-item{padding:12px 0;border-bottom:1px solid var(--border-light)}
.insight-item:last-child{border-bottom:none}
.insight-item .ins-meta{font-size:11px;color:var(--text-3);margin-bottom:3px}
.insight-item .ins-title{font-weight:600;font-size:14px;line-height:1.5}
.insight-item .ins-body{font-size:13px;color:var(--text-2);line-height:1.7;margin-top:4px}

.block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.block-header h3{margin-bottom:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:767px){.grid-2{grid-template-columns:1fr}}
@media(max-width:480px){
  .stat-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:10px 12px}
  .stat-val{font-size:20px}
  .stat-label{font-size:11px}
  .alert-row .alert-title{font-size:12px}
  .alert-row .alert-desc{font-size:11px}
  .alert-row .alert-alt{font-size:10px}
}

.seg{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:var(--r-xs);overflow:hidden}
.seg button{padding:5px 12px;font-size:12px;color:var(--text-2);transition:all .15s;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--pri);color:#fff;font-weight:500}
.seg-wrap{margin-bottom:14px}

.hold-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.hold-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hold-name{font-weight:600;font-size:14px}
.hold-code{font-size:11px;color:var(--text-3)}
.hold-body{font-size:12px;color:var(--text-2);line-height:1.7}

.vocab-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light)}
.vocab-row:last-child{border-bottom:none}
.vocab-row .vocab-word{font-weight:600;font-size:13px;color:var(--pri);min-width:100px}
.vocab-row .vocab-def{font-size:12px;color:var(--text-2);flex:1}
.vocab-row .vocab-example{font-size:11px;color:var(--text-3);font-style:italic}

.exercise-item{padding:10px 0;border-bottom:1px solid var(--border-light)}
.exercise-item .ex-q{font-size:13px;font-weight:500;margin-bottom:4px}
.exercise-item .ex-opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.exercise-item .ex-opt button{padding:4px 12px;border:1px solid var(--border);border-radius:var(--r-xs);font-size:12px;transition:all .15s}
.exercise-item .ex-opt button:hover{background:var(--pri-bg);border-color:var(--pri)}
.exercise-item .ex-opt button.correct{background:var(--lo-bg);border-color:var(--lo);color:var(--lo)}
.exercise-item .ex-opt button.wrong{background:var(--hi-bg);border-color:var(--hi);color:var(--hi)}
.exercise-item .ex-ans{font-size:12px;color:var(--lo);margin-top:4px;display:none}

.pricing-section{margin-bottom:18px}
.pricing-section h3{font-size:14px;color:var(--pri);margin-bottom:8px}
.note-meta{font-size:11px;color:var(--text-3);margin-top:4px;font-style:italic}

.source-tag{font-size:10px;color:var(--text-3);background:var(--bg-soft);padding:1px 6px;border-radius:3px;white-space:nowrap}

.reminder-bar{background:var(--mid-bg);border:1px solid var(--mid);color:var(--mid);padding:9px 14px;border-radius:var(--r-sm);font-size:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{text-align:center;padding:24px 16px;color:var(--text-3);font-size:13px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg-card);border-radius:var(--r);padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:17px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{pointer-events:auto;padding:10px 16px;border-radius:var(--r-sm);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.1);animation:slideIn .3s ease;max-width:340px}
.toast.success{background:var(--lo);color:#fff}
.toast.error{background:var(--hi);color:#fff}
.toast.warning{background:var(--mid);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

.dscl{font-size:11px;color:var(--text-3);font-style:italic;margin-top:2px}
.highlight{color:var(--pri);font-weight:600}
.text-hi{color:var(--hi)}.text-mid{color:var(--mid)}.text-lo{color:var(--lo)}

.eng-passage{background:var(--bg-subtle);padding:14px 16px;border-radius:var(--r-sm);font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid var(--pri)}
.eng-passage .highlight-word{color:var(--pri);font-weight:600;border-bottom:1px dashed var(--pri);cursor:help}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="app">
<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="2"/></svg>
    <span class="title">Raymond<br>全球物流工作台</span>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-tab="overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 晨光</button>
    <button data-tab="shipping"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M12 21c1.3 0 1.9.5 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 16l1-7h18l1 7"/><rect x="3" y="12" width="18" height="4" rx="1"/></svg> 航运</button>
    <button data-tab="invest"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> 投资</button>
    <button data-tab="english"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="18" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></svg> 英语</button>
    <button data-tab="growth"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg> 认知</button>
  </nav>
  <div class="sidebar-footer">
    <span class="count" id="sbarCount">—</span>
    <button onclick="exportAll()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出备份</button>
    <button onclick="importAll()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 导入恢复</button>
    <button onclick="syncToCloud()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/><polyline points="12 6 12 12 16 14"/></svg> 跨设备同步</button>
    <button onclick="clearAll()" style="color:var(--hi)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> 清空数据</button>
  </div>
</aside>

<header class="topbar">
  <span class="title">Raymond · 全球物流工作台</span>
  <div class="actions">
    <span id="dataStatus" style="font-size:11px;color:var(--text-3);margin-right:6px"></span>
    <button class="btn btn-sm btn-ghost" onclick="syncToCloud()">同步</button>
    <button class="btn btn-sm btn-ghost" onclick="exportAll()">导出</button>
    <button class="btn btn-sm btn-ghost" onclick="importAll()">导入</button>
  </div>
</header>

<main class="main" id="mainContent">

<!-- ===== TAB: 晨光 ===== -->
<section class="tab-panel active" id="tab-overview">
  <div class="reminder-bar" id="reminderBar" style="display:none"><span id="reminderMsg"></span><button class="btn btn-sm btn-out" onclick="exportAll()">立即导出</button></div>
  <h2>晨光 · 今日概览</h2>
  <p id="todayDate" style="font-size:13px;color:var(--text-2);margin-bottom:16px"></p>
  <div class="stat-row" id="alertSummary"></div>
  <div class="grid-2">
    <div class="card"><h4>今日预警摘要</h4><div id="todayAlerts"></div></div>
    <div class="card"><h4>投资快讯</h4><div id="investSnapshot"></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h4>今日认知精选</h4><div id="todayBriefs"></div></div>
</section>

<!-- ===== TAB: 航运 ===== -->
<section class="tab-panel" id="tab-shipping">
  <h2>航运 · 工作台</h2>
  <div class="seg-wrap"><div class="seg" id="shipSeg">
    <button class="active" data-sub="alerts">晨间预警</button>
    <button data-sub="pricing">运价数据库</button>
    <button data-sub="ports">口岸情况</button>
    <button data-sub="carrier">船公司资讯</button>
    <button data-sub="risks">风险应急</button>
    <button data-sub="compliance">合规指南</button>
  </div></div>
  <div id="shipPanel"></div>
</section>

<script>
// ===== UTILS =====
const P='wb_pilot_';
const TS='2026-08-09';
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtMoney(v){return'¥'+Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function s(key,val){
  if(arguments.length===1){try{const r=localStorage.getItem(P+key);return r?JSON.parse(r):null}catch(e){showToast('数据读取异常，建议从备份恢复','error');return null}}
  else{try{localStorage.setItem(P+key,JSON.stringify(val));return true}catch(e){if(e.name==='QuotaExceededError')showToast('存储空间已满，请导出备份后清理数据','error');else showToast('保存失败：'+e.message,'error');return false}}
}
let toastTimer;
function showToast(msg,type='success'){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2800)}
function showModal(title,body,confirmLabel,onConfirm){const o=document.getElementById('modalOverlay');document.getElementById('modalContent').innerHTML='<h3>'+title+'</h3>'+body+'<div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button><button class="btn btn-pri btn-sm" id="mConfirm">'+confirmLabel+'</button></div>';o.style.display='flex';if(onConfirm)document.getElementById('mConfirm').addEventListener('click',()=>{onConfirm();closeModal()})}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ===== NAV =====
let currentTab='overview';
let shipSub='alerts',invSub='holdings',engSub='vocab',groSub='daily';
function switchTab(t){currentTab=t;document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.querySelectorAll('.sidebar-nav button,.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderCurrent()}
function renderCurrent(){switch(currentTab){case'overview':renderOverview();break;case'shipping':renderShipPanel();break;case'invest':renderInvPanel();break;case'english':renderEngPanel();break;case'growth':renderGroPanel();break}checkBackup();updateCount()}
document.querySelectorAll('.sidebar-nav button,.bottom-nav button').forEach(b=>b.addEventListener('click',function(){switchTab(this.dataset.tab)}));
document.getElementById('shipSeg').addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){document.querySelectorAll('#shipSeg button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');shipSub=e.target.dataset.sub;renderShipPanel()}});
document.getElementById('invSeg').addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){document.querySelectorAll('#invSeg button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');invSub=e.target.dataset.sub;renderInvPanel()}});
document.getElementById('engSeg').addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){document.querySelectorAll('#engSeg button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');engSub=e.target.dataset.sub;renderEngPanel()}});
document.getElementById('groSeg').addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){document.querySelectorAll('#groSeg button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');groSub=e.target.dataset.sub;renderGroPanel()}});

function totalCount(){const d=s('pilot_data');if(!d)return 0;let c=0;['alerts','pricing','ports','carriers','risks','compliance','holdings','indices','globalNews','vocab','reading','writing','daily','learn','insights'].forEach(k=>{if(d[k])c+=Array.isArray(d[k])?d[k].length:0});return c}
function updateCount(){document.getElementById('sbarCount').textContent='存储 '+totalCount()+' 条记录'}
function checkBackup(){const ct=totalCount();const bar=document.getElementById('reminderBar');if(ct>=20&&!s('backup_reminded')){document.getElementById('reminderMsg').textContent='数据已积累 '+ct+' 条，建议导出备份';bar.style.display='flex';s('backup_reminded',true)}}

function exportAll(){const d=s('pilot_data')||{};d.exportDate=fmtDate(new Date());d.exportVersion=1;const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Raymond工作台_备份_'+fmtDate(new Date())+'.json';a.click();URL.revokeObjectURL(a.href);s('backup_reminded',null);document.getElementById('reminderBar').style.display='none';showToast('备份已导出','success')}
function importAll(){document.getElementById('importFile').click()}
async function handleImport(e){const f=e.target.files[0];if(!f)return;try{const t=await f.text();const d=JSON.parse(t);s('pilot_data',d);s('backup_reminded',null);document.getElementById('reminderBar').style.display='none';showToast('成功导入 '+(d.exportDate||'')+' 的备份','success');renderCurrent()}catch(err){showToast('备份文件格式异常：'+err.message,'error')}e.target.value=''}
function clearAll(){showModal('清空全部数据','<p style="color:var(--hi);font-size:13px">此操作将删除所有本地数据，不可恢复。</p><p style="font-size:12px;color:var(--text-2);margin-top:6px">建议先导出备份。</p>','确认清空',()=>{localStorage.removeItem(P+'pilot_data');localStorage.removeItem(P+'backup_reminded');location.reload()})}
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();exportAll()}});

    reading:[{id:'rd1',title:'Red Sea Crisis Reshapes Global Shipping Routes',passage:'The ongoing security crisis in the Red Sea region has fundamentally altered global maritime trade patterns. Since late 2023, Houthi attacks on commercial vessels have forced major shipping lines — including Maersk, CMA CGM, and MSC — to reroute vessels around the Cape of Good Hope. This detour adds approximately 10-14 days of transit time for Asia-Europe routes and reduces effective global container capacity by an estimated 9%.\n\nConsequently, container freight rates have experienced significant volatility. The Shanghai Containerized Freight Index (SCFI) has risen sharply, with spot rates on the Asia-Europe route more than doubling at peak periods. While the market has partially adjusted to the "new normal" of longer transit times, the security situation remains unpredictable, keeping upward pressure on freight costs.\n\nFor logistics managers, the key challenge lies in supply chain planning. Companies are increasingly adopting buffer stock strategies and exploring alternative transport modes, including China-Europe Railway Express services, which have seen a 15% year-on-year increase in volumes. Multimodal solutions — combining sea, rail, and road transport — are becoming the standard approach for resilient supply chain management.',questions:[{q:'What is the primary cause of the rerouting described in the passage?',opts:['A) Rising fuel costs','B) Houthi attacks on commercial vessels','C) Port congestion in Europe','D) New environmental regulations'],ans:1},
    {q:'According to the passage, how much has global container capacity decreased?',opts:['A) Approximately 5%','B) Approximately 15%','C) Approximately 9%','D) Approximately 20%'],ans:2},
    {q:'What alternative transport mode is mentioned as growing in popularity?',opts:['A) Air freight','B) China-Europe Railway Express','C) Pipeline transport','D) Inland waterways'],ans:1}]}],
    writing:[{id:'w1',title:'Business Email: Freight Rate Negotiation',prompt:'You are a logistics manager at a Chinese export company. Write a professional email to your shipping agent to negotiate freight rates for the upcoming peak season. Address the following points: (1) Request a revised quotation for the Asia-Europe route; (2) Highlight your company\'s shipping volume and long-term partnership; (3) Propose a trial period for a new rate structure.',sample:'Dear Mr. Thompson,\n\nI hope this email finds you well. I am writing to discuss the freight rates for our Asia-Europe shipments in light of the upcoming peak season.\n\nAs you are aware, our company has maintained a consistent shipping volume of approximately 150 TEU per month on the Shanghai-Rotterdam route over the past three years. Given this sustained partnership and the current market conditions — particularly the ongoing Red Sea rerouting that has impacted capacity — we believe there is a strong basis for revisiting our rate structure.\n\nWe would appreciate it if you could provide a revised quotation that reflects the following considerations: (1) A volume-based discount commensurate with our annual commitment of 1,800 TEU; (2) A fixed-rate agreement for Q4 2026 to provide budget certainty for both parties; (3) Flexibility to adjust the allocation between 20GP and 40GP/HQ containers based on demand.\n\nFurthermore, we would like to propose a three-month trial period during which we commit to a minimum volume of 160 TEU per month in exchange for a 5-7% reduction on the prevailing spot rate. This arrangement would allow us to evaluate the new structure while ensuring you receive guaranteed volume.\n\nI would be happy to schedule a call next week to discuss this proposal in detail. Please let me know your availability.\n\nThank you for your continued partnership. I look forward to your response.\n\nBest regards,\nRaymond\nLogistics Manager',vocab:['sustained partnership','prevailing spot rate','volume-based discount','budget certainty','commensurate','allocation']},
    {id:'w2',title:'IELTS Task 1: Container Throughput Chart Description',prompt:'The chart below shows the monthly container throughput (in million TEU) at Shanghai Port, Ningbo-Zhoushan Port, and Shenzhen Port from January to June 2026. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.',sample:'The bar chart illustrates the monthly container throughput at three major Chinese ports — Shanghai, Ningbo-Zhoushan, and Shenzhen — during the first half of 2026.\n\nOverall, Shanghai Port maintained the highest throughput throughout the period, consistently exceeding 4 million TEU per month. Ningbo-Zhoushan ranked second, while Shenzhen recorded the lowest figures among the three.\n\nIn January, Shanghai processed approximately 4.2 million TEU, compared to 3.1 million at Ningbo-Zhoushan and 2.6 million at Shenzhen. A notable increase was observed across all ports in March, coinciding with the post-Lunar New Year export surge. Shanghai\'s throughput peaked at 4.8 million TEU in May, representing a 14% rise from January. Similarly, Ningbo-Zhoushan saw its highest figure of 3.6 million TEU in the same month.\n\nInterestingly, Shenzhen experienced a more modest growth trajectory, with throughput fluctuating between 2.6 and 3.0 million TEU. The relatively flat trend at Shenzhen may be attributed to shifts in manufacturing supply chains toward inland regions.\n\nIn conclusion, while all three ports demonstrated growth in the first half of 2026, Shanghai\'s dominance remained unchallenged, and the disparity between the largest and smallest port widened over the period.',vocab:['throughput','fluctuating','growth trajectory','attributed to','disparity','coinciding with']},
    {id:'w3',title:'Business Report: Supply Chain Risk Assessment',prompt:'Write a brief supply chain risk assessment report (200-250 words) for your company\'s management. Identify two key risks affecting your Asia-Europe logistics corridor, assess their potential impact, and recommend mitigation strategies. Use formal business report conventions.',sample:'Supply Chain Risk Assessment Report\nAsia-Europe Corridor | Q3 2026\n\n1. Executive Summary\nThis report identifies two critical risks currently affecting our Asia-Europe logistics operations and proposes mitigation measures to safeguard supply chain continuity.\n\n2. Risk Assessment\n\nRisk 1: Red Sea Security Disruption (Severity: High)\nThe persistent threat of Houthi attacks in the Red Sea has forced carriers to reroute vessels via the Cape of Good Hope, extending transit times by 10-14 days and reducing effective capacity by approximately 9%. The financial impact includes a 15-20% increase in freight costs and higher inventory carrying costs due to extended lead times.\n\nRisk 2: China-Europe Railway Bottlenecks (Severity: Medium)\nMaintenance work on the Kazakh rail network has reduced throughput capacity at the Alashankou/Dostyk border crossing by approximately 30%, resulting in 1-2 day delays for Chengdu and Chongqing-bound services.\n\n3. Recommendations\n\n• Diversify routing: Shift 20% of rail-bound volumes to the Khorgos crossing, which currently operates at full capacity with minimal delays.\n• Implement buffer stock: Increase safety stock for time-sensitive SKUs by 15% to absorb transit variability.\n• Secure long-term contracts: Negotiate fixed-rate agreements with two carriers to hedge against spot rate volatility during peak season.\n• Monitor developments: Establish a weekly risk monitoring protocol with real-time updates from freight forwarders.\n\nPrepared by: Logistics Department\nDate: 9 August 2026',vocab:['mitigation measures','supply chain continuity','effective capacity','carrying costs','buffer stock','spot rate volatility']}],
    daily:[{title:'欧盟AI法案正式实施，全球首部全面AI监管法规落地',source:'BBC / 36Kr',date:'2026-08-08',desc:'欧盟《人工智能法案》8月1日起分阶段实施，高风险AI系统（招聘、信贷、执法等）需满足透明度、可解释性和人类监督要求。对物流行业的影响：AI驱动的路线优化、需求预测系统可能被归类为"有限风险"，需要提供用户知情权。中国AI企业出海欧洲需提前合规。',tag:'科技'},
    {title:'全球港口数字化竞赛加速：鹿特丹港部署数字孪生3.0',source:'Port Technology',date:'2026-08-07',desc:'鹿特丹港宣布升级数字孪生系统至3.0版本，实现港口作业全要素实时仿真。船舶到港时间预测精度提升至±15分钟，码头利用率提升12%。新加坡港、上海港也在推进类似项目。数字化港口正在成为全球物流效率竞争的新赛道。',tag:'物流科技'},

    {title:'生活方式：城市骑行通勤的兴起与安全出行指南',source:'三联生活周刊',date:'2026-08-07',desc:'上海、北京、深圳等城市骑行通勤人数同比增60%+。共享单车升级（美团/哈啰投放新一代电单车），城市骑行道覆盖率提高。健康效益：每日骑行30分钟可降低心血管疾病风险31%。通勤建议：早高峰7:30前骑行体感温度最低，防晒+头盔+反光装备必备。',tag:'生活'},
    {title:'管理思维：从"效率优先"到"韧性优先"的供应链范式转换',source:'Harvard Business Review / 中译版',date:'2026-08-06',desc:'HBR最新研究指出，全球供应链管理正在经历范式转换——从过去三十年"Just-in-Time效率优先"转向"Just-in-Case韧性优先"。关键转变：安全库存从30天延长至45-60天、供应商多元化（从单源到3+2模式）、近岸外包比例上升。中国物流经理需关注这一趋势对出口订单结构和船期安排的影响。',tag:'管理'}],

    insights:[{title:'航运周期与库存周期的共振：Q3出口前瞻',content:'集运运价指数的上涨通常领先于制造业库存回补2-3个月。当前观察：SCFI连续三周上涨+中国PMI原材料库存指数回升至47.5，这一组合在历史上多次领先出口旺季。叠加红海绕行造成的有效运力下降约9%，Q3旺季可能出现"需求回暖+供给受限"的双击效应。对物流经理的实操含义：1)美西/欧洲线建议提前2-3周订舱；2)可考虑锁定30-45天的短期约价锁定成本；3)关注9月GRI公布节奏。以上为趋势判断，仅供参考。',date:'2026-08-08',source:'参考判断'},

const REMOTE_KEYS=['alerts','pricing','ports','carriers','risks','compliance','holdings','indices','globalNews','vocab','reading','writing','daily','learn','insights'];
async function fetchRemoteData(){
  try{
    const[br,lr,pr,cr]=await Promise.all([
      fetch('data/briefing.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/logistics.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/portfolio.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/cognition.json').then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(!br&&!lr&&!pr&&!cr){updateDataStatus(null);return}
    const rd=br?.date||lr?.date||pr?.date||cr?.date||'';
    const local=s('pilot_data')||{};
    if(rd&&rd===local._remoteDate){updateDataStatus(rd);return}
    const m={};
    if(br){
      if(br.alerts)m.alerts=br.alerts.map(a=>{
        const srcMatch=(a.desc||'').match(/来源[：:](.+?)(?:$|。)/);
        const descClean=(a.desc||'').replace(/来源[：:].+$/,'').trim();
        const cats={high:'高风险',mid:'中风险',low:'低风险'};
        return{id:genId(),level:a.level||'mid',title:a.title,desc:descClean,source:srcMatch?srcMatch[1].trim():'综合',alt:a.alternative||'',date:br.date,cat:cats[a.level]||'综合'};
      });
      if(br.news)m.globalNews=br.news.map(n=>({id:genId(),cat:n.category,level:n.impact==='高'?'high':n.impact==='中'?'mid':'low',title:n.title,desc:n.desc,source:n.category+' · '+n.tag,date:br.date}));
      if(br.ports||br.railPorts){m.ports=[];
        (br.ports||[]).forEach(p=>{const st=p.status.includes('严重')||p.status.includes('拥堵')?'拥堵':p.status.includes('恢复')||p.status.includes('繁忙')?'轻微拥堵':'畅通';m.ports.push({id:genId(),name:p.name,type:'海港口岸',status:st,congestion:p.note||'',delay:'等泊'+(p.waitDays||'未知')+'天',source:(p.note||'').split('来源：')[1]||'综合',date:br.date})});
        (br.railPorts||[]).forEach(p=>{m.ports.push({id:genId(),name:p.name,type:'铁路口岸',status:p.status.includes('拥堵')?'拥堵':'畅通',congestion:p.note||'',delay:'等泊'+(p.waitDays||'1-2')+'天',source:(p.note||'').split('来源：')[1]||'综合',date:br.date})});
      }
      if(br.markets){m.indices=[];
        if(br.markets.shanghai)m.indices.push({name:'上证指数',value:br.markets.shanghai.value,change:br.markets.shanghai.change,date:br.date});
        if(br.markets.shenzhen)m.indices.push({name:'深证成指',value:br.markets.shenzhen.value,change:br.markets.shenzhen.change,date:br.date});
        if(br.markets.global)br.markets.global.forEach(g=>{if(g.name.includes('恒生科技'))m.indices.push({name:'恒生科技指数',value:g.close,change:g.change,date:br.date})});
      }
    }
    if(lr){
      if(lr.freight)m.pricing={weekly:lr.week||lr.date||'',routes:lr.freight.map(f=>({route:f.route,rate20:f.rate||'-',rate40:f.rate||'-',wow:f.change||'→ 0.0%',trend:f.trend,note:f.trend})),railway:(lr.railFreight||[]).map(r=>({route:r.route,container:r.rate||'-',lcl:'-',wow:'→',stability:(r.stability||4)*20,note:r.note}))};
      if(lr.risks)m.risks=lr.risks.map(r=>({id:genId(),level:r.level,area:(r.title||'').split('·')[0].trim(),desc:r.desc,impact:r.desc,alt:r.alternative||'',source:'综合',date:lr.date}));
      if(lr.compliance)m.compliance=lr.compliance.map(c=>({id:genId(),tag:c.tag,title:c.title,date:lr.date,source:c.source||'海关总署/商务部',summary:c.summary||c.desc,action:c.action||(c.desc||'')}));
      if(lr.carriers)m.carriers=lr.carriers.map(c=>({id:genId(),company:c.company,level:c.level||'mid',title:c.title,desc:c.desc,source:c.source||'综合',date:lr.date}));
    }
    if(pr){
      m.holdings=[];
      if(pr.stocks)pr.stocks.forEach(st=>{const rec=(pr.recommendations||[]).find(r=>r.target.includes(st.code));m.holdings.push({id:genId(),code:st.code,name:st.name,type:'股票',price:String(st.close),change:st.change,sug:rec?rec.action:'HOLD',analysis:rec?rec.advice:(st.note||''),date:pr.date})});
      if(pr.funds)pr.funds.forEach(f=>{const rec=(pr.recommendations||[]).find(r=>r.target.includes(f.code));m.holdings.push({id:genId(),code:f.code,name:f.name,type:'基金',price:f.nav,change:f.change,sug:rec?rec.action:'HOLD',analysis:f.note||(rec?rec.advice:''),date:pr.date})});
    }
    if(cr){
      m.daily=[];
      if(cr.frontier)cr.frontier.forEach(f=>m.daily.push({id:genId(),source:'综合',date:cr.date,tag:f.tag,title:f.title,desc:f.desc}));
      if(cr.life)cr.life.forEach(l=>m.daily.push({id:genId(),source:'综合',date:cr.date,tag:'生活实用',title:l.title,desc:l.desc}));
      if(cr.growth)m.learn=cr.growth.map(g=>({title:g.title,type:g.icon||'📖',desc:g.desc,note:'',date:cr.date}));
      if(cr.english&&cr.english.vocab)m.vocab=cr.english.vocab.map(v=>({word:v.word,phonetic:v.phonetic||'',def:v.meaning,example:v.example,date:cr.date}));
      if(cr.english&&cr.english.email)m.writing=cr.english.email.map(e=>({id:genId(),title:e.title,prompt:'Business English Email · IELTS 6-7',sample:e.body.replace(/\n/g,'<br>'),vocab:[],date:cr.date}));
      if(cr.english&&cr.english.sentences)m.reading=cr.english.sentences.map(sn=>({id:genId(),title:sn.title,level:'IELTS 6-7',passage:sn.text,questions:'<b>关键词：</b>'+sn.keywords+'<br><br><b>参考翻译：</b>'+sn.translation+'<br><br><b>学习建议：</b>'+sn.analysis,date:cr.date}));
      if(cr.insights)m.insights=cr.insights.map(s=>({title:s.title,content:s.content,date:cr.date,source:s.source||'公众号精选'}));
    }
    const merged={...local};
    REMOTE_KEYS.forEach(k=>{if(m[k]!==undefined)merged[k]=m[k]});
    merged._remoteDate=rd;merged._lastSync=new Date().toISOString();
    s('pilot_data',merged);
    if(rd!==local._remoteDate)showToast('数据已更新至 '+rd,'success');
    updateDataStatus(rd);
  }catch(e){console.log('Remote fetch skipped:',e.message);updateDataStatus(null)}
}
function updateDataStatus(date){
  const el=document.getElementById('dataStatus');
  if(!el)return;
  if(date)el.textContent='数据更新: '+date;else el.textContent='';
}

// ===== CROSS-DEVICE SYNC =====
function syncToCloud(){
  const d=s('pilot_data');
  if(!d)return showToast('暂无数据可同步','error');
  try{
    const json=JSON.stringify(d);
    const b64=btoa(unescape(encodeURIComponent(json)));
    const url=window.location.origin+window.location.pathname+'#sync='+b64;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>{
        showModal('跨设备同步','<p style="font-size:13px;color:var(--text-2)">同步链接已复制到剪贴板，在另一台设备的浏览器中打开即可导入个人数据。</p><div style="background:var(--bg-soft);padding:10px;border-radius:7px;margin-top:8px;word-break:break-all;font-size:11px;color:var(--text-3);max-height:80px;overflow:auto">'+url+'</div><p style="font-size:12px;color:var(--text-3);margin-top:6px">※ 链接包含您的个人数据，请勿泄露。信息类内容由自动化每日更新，无需手动同步。</p>','知道了',()=>{});
      }).catch(()=>showSyncModal(url));
    }else showSyncModal(url);
  }catch(e){showToast('同步失败：数据量过大，请使用导出备份功能','error')}
}
function showSyncModal(url){
  showModal('跨设备同步','<p style="font-size:13px">请复制以下链接，在另一台设备浏览器中打开：</p><textarea style="width:100%;height:80px;font-size:11px;margin-top:8px" readonly>'+url+'</textarea>','知道了',()=>{});
}
function importFromHash(){
  const h=window.location.hash;
  if(h.startsWith('#sync=')){
    try{
      const b64=h.slice(6);
      const json=decodeURIComponent(escape(atob(b64)));
      const d=JSON.parse(json);
      s('pilot_data',d);
      showToast('已从同步链接导入个人数据','success');
      history.replaceState(null,'',window.location.pathname);
    }catch(e){showToast('同步链接数据异常','error')}
  }
}

// ===== PWA SERVICE WORKER =====
if('serviceWorker'in navigator&&window.location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ===== INIT =====
function updateTodayDate(){
  const el=document.getElementById('todayDate');
  if(!el)return;
  const n=new Date();
  const wd=['日','一','二','三','四','五','六'];
  const ds=s('pilot_data');
  const rd=ds?ds._remoteDate:'';
  el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+wd[n.getDay()]+(rd?' · 数据更新: '+rd:'');
}
initDemo();
importFromHash();
updateTodayDate();
renderCurrent();updateCount();
fetchRemoteData().then(()=>{updateTodayDate();renderCurrent();updateCount()});
</script>
