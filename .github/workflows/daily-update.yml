name: Daily Dashboard Auto Update

on:
  schedule:
    - cron: '0 0 * * *'    # 北京 08:00
    - cron: '30 1 * * *'   # 北京 09:30
    - cron: '0 2 * * *'    # 北京 10:00（新增，覆盖 schedule 延迟窗口）
    - cron: '0 4 * * *'    # 北京 12:00（新增）
    - cron: '0 6 * * *'    # 北京 14:00（新增）
    - cron: '0 7 * * *'    # 北京 15:00
    - cron: '0 9 * * *'    # 北京 17:00
    - cron: '0 12 * * *'   # 北京 20:00（新增，晚间美股盘前）
    - cron: '0 15 * * *'   # 北京 23:00（新增，夜间美股盘中）
  workflow_dispatch: {}    # 支持在 GitHub Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: pilot-daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run auto update script
        run: python scripts/update_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "pilot-bot"
          git config user.email "pilot-bot@users.noreply.github.com"
          # 推送前先拉取远程最新，绝不覆盖任何新提交（防回退）
          git fetch origin main
          git pull --rebase origin main 2>&1 || echo "(rebase skip)"
          git add -A
          git diff --cached --quiet && echo "No data changes, skip commit" && exit 0
          git commit -m "Daily auto update $(date -u +%Y-%m-%d)"
          git push origin main 2>&1 || { git pull --rebase origin main 2>&1; git push origin main 2>&1; }
