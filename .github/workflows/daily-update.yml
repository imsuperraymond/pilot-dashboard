name: Daily Dashboard Auto Update

on:
  schedule:
    - cron: '0 0 * * *'    # 北京 08:00（早盘前预备，即使延迟2h也能在10:00前完成）
    - cron: '30 1 * * *'   # 北京 09:30（A股开盘，抓盘中实时价）
    - cron: '0 7 * * *'    # 北京 15:00（A股收盘前，更新盘中最新）
    - cron: '0 9 * * *'    # 北京 17:00（收盘后定版，确保当日收盘数据）
  workflow_dispatch: {}    # 支持在 GitHub Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: pilot-daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run auto update script
        run: python scripts/update_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "pilot-bot"
          git config user.email "pilot-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No data changes, skip commit" && exit 0
          git commit -m "Daily auto update $(date -u +%Y-%m-%d)"
          git push
